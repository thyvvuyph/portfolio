<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <script>
    (function(){var t=localStorage.getItem('theme');if(t==='light'){document.documentElement.classList.remove('dark');document.documentElement.classList.add('light');}})();
  </script>
  <title>Jacksons Steakhouse — Haley Pham</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Gugi&family=Electrolize&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    .font-[Hanken_Grotesk] { font-family: 'Gugi', sans-serif !important; font-weight: 400 !important; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 0.75rem; }
    ::-webkit-scrollbar-thumb:hover { background: #60A5FA; }
    html { scroll-behavior: smooth; }
    .glass-panel {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
    }
      /* Light theme overrides */
    html.light body { background: #f8fafc; color: #1e293b; }
    html.light header { background: rgba(248,250,252,0.9); border-color: rgba(0,0,0,0.25); }
    html.light .bg-\[\#020617\]\/80 { background: rgba(248,250,252,0.9); }
    html.light .bg-\[\#020617\] { background: #f8fafc; }
    html.light .text-\[\#dae2fd\] { color: #1e293b; }
    html.light .text-\[\#c2c6d6\] { color: #475569; }
    html.light .text-\[\#60A5FA\] { color: #2563eb; }
    html.light .text-\[\#94A3B8\] { color: #64748b; }
    html.light .border-white\/10 { border-color: rgba(0,0,0,0.3); }
    html.light .bg-deep-slate\/50 { background: rgba(255,255,255,0.9); }
    html.light h1, html.light h2, html.light h3 { color: #0f172a; }
    html.light img { border: 1px solid rgba(0,0,0,0.15); }
    html.light .rounded-2xl, html.light .rounded-lg { border: 1px solid rgba(0,0,0,0.15); }
    html.light .rounded-full { border-color: rgba(0,0,0,0.15); }
    html.light a[class*="text-\[\#60A5FA\]"] { color: #2563eb; }
    html.light .hover\:text-white:hover { color: #1e293b; }
    html.light .masonry-item img { border: 1px solid rgba(0,0,0,0.08); }
  </style>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "charcoal-surface": "#020617",
            "deep-slate": "#1E293B",
            "electric-blue": "#60A5FA",
            "refined-coral": "#FB7185",
            "on-surface": "#dae2fd",
            "on-surface-variant": "#c2c6d6",
            "muted-text": "#94A3B8",
            "surface-container": "#171f33",
            "primary": "#adc6ff",
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#020617] text-[#dae2fd] antialiased">

  <!-- Header -->
  <header class="fixed top-0 w-full z-50 bg-[#020617]/80 backdrop-blur-md border-b border-white/10 flex items-center justify-between h-16 px-[20px] md:px-[32px]">
    <a href="./" class="flex items-center gap-2 text-[#60A5FA] hover:text-white transition-colors duration-300">
      <span class="material-symbols-outlined text-[20px]">arrow_back</span>
      <span class="font-[JetBrains_Mono] text-[14px] tracking-[0.1em]" data-i18n="back">Back</span>
    </a>
    <div class="flex items-center gap-4">
      <button id="lang-toggle" class="text-[#c2c6d6] hover:text-[#60A5FA] transition-colors duration-300 font-[JetBrains_Mono] text-[13px] tracking-normal flex items-center" aria-label="Toggle language">
        <span id="lang-label">EN</span>
      </button>
      <button id="theme-toggle" class="text-[#c2c6d6] hover:text-[#60A5FA] transition-colors duration-300" aria-label="Toggle theme">
        <span class="material-symbols-outlined text-[20px]" id="theme-icon">dark_mode</span>
      </button>
    </div>
  </header>

  <main class="pt-24 pb-24 px-[20px] md:px-[32px] max-w-[1280px] mx-auto">

    <!-- Hero -->
    <div class="mb-4">
      <h1 class="font-[Hanken_Grotesk] text-[48px] md:text-[72px] font-[400] leading-tight tracking-[-0.04em] mt-4 mb-6">Jacksons Steakhouse</h1>
      <p class="font-[Inter] text-[18px] leading-[28px] text-[#c2c6d6] max-w-2xl" data-i18n="desc">
        Menu print design for Jacksons Steakhouse — a premium steakhouse restaurant. The work includes lunch menu and dessert menu mockups with elegant, refined layouts.
      </p>
    </div>

    <!-- Tags -->
    <div class="flex flex-wrap gap-3 mb-10">
      <span class="font-[JetBrains_Mono] text-[12px] tracking-[0.1em] border border-white/10 text-[#c2c6d6] px-4 py-2 rounded-full" data-i18n="tag1">Print Design</span>
      <span class="font-[JetBrains_Mono] text-[12px] tracking-[0.1em] border border-white/10 text-[#c2c6d6] px-4 py-2 rounded-full" data-i18n="tag2">Menu</span>
      <span class="font-[JetBrains_Mono] text-[12px] tracking-[0.1em] border border-white/10 text-[#c2c6d6] px-4 py-2 rounded-full" data-i18n="tag3">F&B</span>
    </div>

    <!-- Menu images -->
    <div class="flex flex-col md:flex-row gap-4 mb-4 md:items-center">
      <div class="rounded-2xl overflow-hidden md:w-[35%]">
        <img src="/jacksons-lunch-menu.jpg" alt="Jacksons Steakhouse lunch menu mockup" class="w-full object-contain"/>
      </div>
      <div class="rounded-2xl overflow-hidden md:w-[65%]">
        <img src="/jacksons-menu-dessert.jpg" alt="Jacksons Steakhouse menu and dessert mockup" class="w-full object-contain"/>
      </div>
    </div>

    <!-- 4 menu pages -->
    <div class="flex gap-4 overflow-x-auto pb-2 md:grid md:grid-cols-2 md:overflow-visible mb-16">
      <div class="flex-none w-[60vw] md:w-auto rounded-2xl overflow-hidden">
        <img src="/jacksons-main-menu.jpg" alt="Jacksons Steakhouse main menu" class="w-full object-cover"/>
      </div>
      <div class="flex-none w-[60vw] md:w-auto rounded-2xl overflow-hidden">
        <img src="/jacksons-dessert-menu.jpg" alt="Jacksons Steakhouse dessert menu" class="w-full object-cover"/>
      </div>
      <div class="flex-none w-[60vw] md:w-auto rounded-2xl overflow-hidden">
        <img src="/jacksons-lunch-eng.jpg" alt="Jacksons Steakhouse lunch menu English" class="w-full object-cover"/>
      </div>
      <div class="flex-none w-[60vw] md:w-auto rounded-2xl overflow-hidden">
        <img src="/jacksons-bar-menu.jpg" alt="Jacksons Steakhouse bar menu" class="w-full object-cover"/>
      </div>
    </div>

    <!-- Back to portfolio -->
    <div class="border-t border-white/10 pt-12 flex justify-between items-center">
      <a href="./" class="flex items-center gap-2 text-[#60A5FA] font-[JetBrains_Mono] text-[14px] tracking-[0.1em] hover:text-white transition-colors duration-300">
        <span class="material-symbols-outlined text-[20px]">arrow_back</span>
        <span data-i18n="back-portfolio">BACK TO PORTFOLIO</span>
      </a>
    </div>

  </main>

<script>
  // Language toggle (EN/VI)
  (function() {
    var translations = {
      vi: {
        'back': 'Quay lại',
        'desc': 'Thiết kế in ấn thực đơn cho Jacksons Steakhouse — một nhà hàng bít tết cao cấp. Công việc bao gồm mockup thực đơn trưa và thực đơn tráng miệng với bố cục thanh lịch, tinh tế.',
        'tag1': 'Thiết Kế In Ấn',
        'tag2': 'Thực Đơn',
        'tag3': 'F&B',
        'back-portfolio': 'VỀ TRANG PORTFOLIO'
      }
    };
    var currentLang = localStorage.getItem('lang') || 'en';
    var originals = {};
    function applyLang(lang) {
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var key = el.getAttribute('data-i18n');
        if (originals[key] === undefined) originals[key] = el.textContent;
        if (lang === 'vi' && translations.vi[key]) {
          el.textContent = translations.vi[key];
        } else {
          el.textContent = originals[key];
        }
      });
      var label = document.getElementById('lang-label');
      if (label) label.textContent = lang === 'en' ? 'EN' : 'VI';
    }
    document.getElementById('lang-toggle').addEventListener('click', function() {
      currentLang = currentLang === 'en' ? 'vi' : 'en';
      localStorage.setItem('lang', currentLang);
      applyLang(currentLang);
    });
    applyLang(currentLang);
  })();
</script>

<script>
  (function() {
    const html = document.documentElement;
    function updateIcon() {
      const icon = document.getElementById('theme-icon');
      if (icon) icon.textContent = html.classList.contains('light') ? 'light_mode' : 'dark_mode';
    }
    document.getElementById('theme-toggle').addEventListener('click', function() {
      if (html.classList.contains('light')) {
        html.classList.remove('light');
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      } else {
        html.classList.remove('dark');
        html.classList.add('light');
        localStorage.setItem('theme', 'light');
      }
      updateIcon();
    });
    updateIcon();
  })();
</script>
</body>
</html>
