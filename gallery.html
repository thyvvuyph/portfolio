<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <script>
    (function(){var t=localStorage.getItem('theme');if(t==='light'){document.documentElement.classList.remove('dark');document.documentElement.classList.add('light');}})();
  </script>
  <title>Gallery — Haley Pham</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Gugi&family=Electrolize&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    .font-[Hanken_Grotesk] { font-family: 'Gugi', sans-serif !important; font-weight: 400 !important; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 0.75rem; }
    ::-webkit-scrollbar-thumb:hover { background: #60A5FA; }
    html { scroll-behavior: smooth; }
    .glass-panel {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .masonry {
      columns: 2;
      column-gap: 12px;
    }
    @media (min-width: 640px) {
      .masonry { columns: 2; column-gap: 16px; }
    }
    @media (min-width: 1024px) {
      .masonry { columns: 3; column-gap: 16px; }
    }
    .masonry-item {
      break-inside: avoid;
      margin-bottom: 12px;
    }
    @media (min-width: 640px) {
      .masonry-item { margin-bottom: 16px; }
    }
    .masonry-item img {
      width: 100%;
      display: block;
      border-radius: 0.5rem;
      transition: transform 0.5s ease, opacity 0.3s ease;
    }
    .masonry-item:hover img {
      transform: scale(1.02);
    }
    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(2, 6, 23, 0.95);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 0.5rem;
    }
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #dae2fd;
      cursor: pointer;
      transition: color 0.3s;
    }
    .lightbox-close:hover {
      color: #60A5FA;
    }
      /* Light theme overrides */
    html.light body { background: #f8fafc; color: #1e293b; }
    html.light header { background: rgba(248,250,252,0.9); border-color: rgba(0,0,0,0.25); }
    html.light .bg-\[\#020617\]\/80 { background: rgba(248,250,252,0.9); }
    html.light .bg-\[\#020617\] { background: #f8fafc; }
    html.light .text-\[\#dae2fd\] { color: #1e293b; }
    html.light .text-\[\#c2c6d6\] { color: #475569; }
    html.light .text-\[\#60A5FA\] { color: #2563eb; }
    html.light .text-\[\#94A3B8\] { color: #64748b; }
    html.light .border-white\/10 { border-color: rgba(0,0,0,0.3); }
    html.light .bg-deep-slate\/50 { background: rgba(255,255,255,0.9); }
    html.light h1, html.light h2, html.light h3 { color: #0f172a; }
    html.light img { border: 1px solid rgba(0,0,0,0.06); }
    html.light .rounded-2xl { border-color: rgba(0,0,0,0.1); }
    html.light .rounded-full { border-color: rgba(0,0,0,0.15); }
    html.light a[class*="text-\[\#60A5FA\]"] { color: #2563eb; }
    html.light .hover\:text-white:hover { color: #1e293b; }
    html.light .masonry-item img { border: 1px solid rgba(0,0,0,0.08); }
  </style>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "charcoal-surface": "#020617",
            "deep-slate": "#1E293B",
            "electric-blue": "#60A5FA",
            "refined-coral": "#FB7185",
            "on-surface": "#dae2fd",
            "on-surface-variant": "#c2c6d6",
            "muted-text": "#94A3B8",
            "surface-container": "#171f33",
            "primary": "#adc6ff",
          }
        }
      }
    }
  </script>
</head>

    <a href="./" class="flex items-center gap-2 text-[#60A5FA] hover:text-white transition-colors duration-300">

    </a>
    <button id="theme-toggle" class="text-[#c2c6d6] hover:text-[#60A5FA] transition-colors duration-300" aria-label="Toggle theme">

  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <span class="lightbox-close material-symbols-outlined text-[32px]" onclick="closeLightbox(event)">close</span>
    <img id="lightbox-img" src="" alt="Full size photo"/>
  </div>

  <script>
    function openLightbox(img) {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      lightboxImg.src = img.src;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox(event) {
      if (event.target === document.getElementById('lightbox') || event.target.classList.contains('lightbox-close')) {
        document.getElementById('lightbox').classList.remove('active');
        document.body.style.overflow = '';
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        document.getElementById('lightbox').classList.remove('active');
        document.body.style.overflow = '';
      }
    });
  </script>

<script>
  (function() {
    const html = document.documentElement;
    function updateIcon() {
      const icon = document.getElementById('theme-icon');
      if (icon) icon.textContent = html.classList.contains('light') ? 'light_mode' : 'dark_mode';
    }
    document.getElementById('theme-toggle').addEventListener('click', function() {
      if (html.classList.contains('light')) {
        html.classList.remove('light');
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      } else {
        html.classList.remove('dark');
        html.classList.add('light');
        localStorage.setItem('theme', 'light');
      }
      updateIcon();
    });
    updateIcon();
  })();
</script>
