<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Orant Neon — Haley Pham</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;800&family=Inter:wght@400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 0.75rem; }
    ::-webkit-scrollbar-thumb:hover { background: #60A5FA; }
    html { scroll-behavior: smooth; }
    .glass-panel {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
    }
  </style>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "charcoal-surface": "#020617",
            "deep-slate": "#1E293B",
            "electric-blue": "#60A5FA",
            "refined-coral": "#FB7185",
            "on-surface": "#dae2fd",
            "on-surface-variant": "#c2c6d6",
            "muted-text": "#94A3B8",
            "surface-container": "#171f33",
            "primary": "#adc6ff",
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#020617] text-[#dae2fd] antialiased">

  <!-- Header -->
  <header class="fixed top-0 w-full z-50 bg-[#020617]/80 backdrop-blur-md border-b border-white/10 flex items-center h-16 px-[20px] md:px-[32px]">
    <a href="./" class="flex items-center gap-2 text-[#60A5FA] hover:text-white transition-colors duration-300">
      <span class="material-symbols-outlined text-[20px]">arrow_back</span>
      <span class="font-[JetBrains_Mono] text-[14px] tracking-[0.1em]">Back</span>
    </a>
  </header>

  <main class="pt-24 pb-24 px-[20px] md:px-[32px] max-w-[1280px] mx-auto">

    <!-- Hero -->
    <div class="mb-4">
      <h1 class="font-[Hanken_Grotesk] text-[48px] md:text-[72px] font-[800] leading-tight tracking-[-0.04em] mt-4 mb-6">Orant Neon</h1>
      <p class="font-[Inter] text-[18px] leading-[28px] text-[#c2c6d6] max-w-2xl">
        Video content and media production for Orant Neon — creating engaging visual content including promotional videos, product showcases, and social media reels.
      </p>
    </div>

    <!-- Tags -->
    <div class="flex flex-wrap gap-3 mb-10">
      <span class="font-[JetBrains_Mono] text-[12px] tracking-[0.1em] border border-white/10 text-[#c2c6d6] px-4 py-2 rounded-full">Video</span>
      <span class="font-[JetBrains_Mono] text-[12px] tracking-[0.1em] border border-white/10 text-[#c2c6d6] px-4 py-2 rounded-full">Media</span>
      <span class="font-[JetBrains_Mono] text-[12px] tracking-[0.1em] border border-white/10 text-[#c2c6d6] px-4 py-2 rounded-full">Content</span>
    </div>

    <!-- Videos -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-16">
      <div class="rounded-2xl overflow-hidden aspect-video">
        <div class="w-full h-full bg-[#1E293B] flex items-center justify-center border border-white/10 rounded-2xl">
          <span class="font-[JetBrains_Mono] text-[14px] text-[#94A3B8]">Video coming soon</span>
        </div>
      </div>
      <div class="rounded-2xl overflow-hidden aspect-video">
        <div class="w-full h-full bg-[#1E293B] flex items-center justify-center border border-white/10 rounded-2xl">
          <span class="font-[JetBrains_Mono] text-[14px] text-[#94A3B8]">Video coming soon</span>
        </div>
      </div>
    </div>

    <!-- Back to portfolio -->
    <div class="border-t border-white/10 pt-12 flex justify-between items-center">
      <a href="./" class="flex items-center gap-2 text-[#60A5FA] font-[JetBrains_Mono] text-[14px] tracking-[0.1em] hover:text-white transition-colors duration-300">
        <span class="material-symbols-outlined text-[20px]">arrow_back</span>
        Back to Portfolio
      </a>
    </div>

  </main>

</body>
</html>
