<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <script>
    (function(){var t=localStorage.getItem('theme');if(t==='light'){document.documentElement.classList.remove('dark');document.documentElement.classList.add('light');}})();
  </script>
  <title>Orant Neon — Haley Pham</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&family=Electrolize&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    .font-glitch { font-family: 'Rubik Glitch Pop', sans-serif !important; font-weight: 400 !important; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 0.75rem; }
    ::-webkit-scrollbar-thumb:hover { background: #60A5FA; }
    html { scroll-behavior: smooth; }
    .glass-panel {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
    }
      /* Light theme overrides */
    html.light body { background: #f8fafc; color: #1e293b; }
    html.light header { background: rgba(248,250,252,0.9); border-color: rgba(0,0,0,0.25); }
    html.light .bg-\[\#020617\]\/80 { background: rgba(248,250,252,0.9); }
    html.light .bg-\[\#020617\] { background: #f8fafc; }
    html.light .text-\[\#dae2fd\] { color: #1e293b; }
    html.light .text-\[\#c2c6d6\] { color: #475569; }
    html.light .text-\[\#60A5FA\] { color: #2563eb; }
    html.light .text-\[\#94A3B8\] { color: #64748b; }
    html.light .border-white\/10 { border-color: rgba(0,0,0,0.3); }
    html.light .bg-deep-slate\/50 { background: rgba(255,255,255,0.9); }
    html.light h1, html.light h2, html.light h3 { color: #0f172a; }
    html.light img { border: 1px solid rgba(0,0,0,0.06); }
    html.light .rounded-2xl { border-color: rgba(0,0,0,0.1); }
    html.light .rounded-full { border-color: rgba(0,0,0,0.15); }
    html.light a[class*="text-\[\#60A5FA\]"] { color: #2563eb; }
    html.light .hover\:text-white:hover { color: #1e293b; }
    html.light .masonry-item img { border: 1px solid rgba(0,0,0,0.08); }
  </style>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "charcoal-surface": "#020617",
            "deep-slate": "#1E293B",
            "electric-blue": "#60A5FA",
            "refined-coral": "#FB7185",
            "on-surface": "#dae2fd",
            "on-surface-variant": "#c2c6d6",
            "muted-text": "#94A3B8",
            "surface-container": "#171f33",
            "primary": "#adc6ff",
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#020617] text-[#dae2fd] antialiased">

  <!-- Header -->
  <header class="fixed top-0 w-full z-50 bg-[#020617]/80 backdrop-blur-md border-b border-white/10 flex items-center justify-between h-16 px-[20px] md:px-[32px]">
    <a href="./" class="flex items-center gap-2 text-[#60A5FA] hover:text-white transition-colors duration-300">
      <span class="material-symbols-outlined text-[20px]">arrow_back</span>
      <span class="font-[Space_Mono] text-[14px] tracking-[0.1em]">Back</span>
    </a>
    <button id="theme-toggle" class="text-[#c2c6d6] hover:text-[#60A5FA] transition-colors duration-300" aria-label="Toggle theme">
      <span class="material-symbols-outlined text-[20px]" id="theme-icon">dark_mode</span>
    </button>
  </header>

  <main class="pt-24 pb-24 px-[20px] md:px-[32px] max-w-[1280px] mx-auto">

    <!-- Hero -->
    <div class="mb-4">
      <h1 class="font-glitch text-[48px] md:text-[72px] font-[400] leading-tight tracking-[-0.04em] mt-4 mb-6">Orant Neon</h1>
      <p class="font-[Electrolize] text-[18px] leading-[28px] text-[#c2c6d6] max-w-2xl">
        Video content and media production for Orant Neon — creating engaging visual content including promotional videos, product showcases, and social media reels.
      </p>
    </div>

    <!-- Tags -->
    <div class="flex flex-wrap gap-3 mb-10">
      <span class="font-[Space_Mono] text-[12px] tracking-[0.1em] border border-white/10 text-[#c2c6d6] px-4 py-2 rounded-full">Video</span>
      <span class="font-[Space_Mono] text-[12px] tracking-[0.1em] border border-white/10 text-[#c2c6d6] px-4 py-2 rounded-full">Media</span>
      <span class="font-[Space_Mono] text-[12px] tracking-[0.1em] border border-white/10 text-[#c2c6d6] px-4 py-2 rounded-full">Content</span>
    </div>

    <!-- Videos -->
    <div class="columns-2 md:columns-3 gap-4 mb-16 space-y-4">
      <div class="rounded-2xl overflow-hidden video-container break-inside-avoid" onclick="toggleVideo(this, '/portfolio/orant-xmas-led.mp4')">
        <img src="/portfolio/orant-xmas-poster.webp" alt="Xmas LED" class="w-full block cursor-pointer"/>
      </div>
      <div class="rounded-2xl overflow-hidden video-container break-inside-avoid" onclick="toggleVideo(this, '/portfolio/orant-eagles.mp4')">
        <img src="/portfolio/orant-eagles-poster.jpg" alt="Philadelphia Eagles" class="w-full block cursor-pointer"/>
      </div>
      <div class="rounded-2xl overflow-hidden video-container break-inside-avoid" onclick="toggleVideo(this, '/portfolio/orant-cleveland.mp4')">
        <img src="/portfolio/orant-cleveland-poster.jpg" alt="Cleveland" class="w-full block cursor-pointer"/>
      </div>
      <div class="rounded-2xl overflow-hidden video-container break-inside-avoid" onclick="toggleVideo(this, '/portfolio/orant-raiders.mp4')">
        <img src="/portfolio/orant-raiders-poster.png" alt="Oakland Raiders" class="w-full block cursor-pointer"/>
      </div>
      <div class="rounded-2xl overflow-hidden video-container break-inside-avoid" onclick="toggleVideo(this, '/portfolio/orant-celtics.mp4')">
        <img src="/portfolio/orant-celtics-poster.webp" alt="Boston Celtics" class="w-full block cursor-pointer"/>
      </div>
      <div class="rounded-2xl overflow-hidden video-container break-inside-avoid" onclick="toggleVideo(this, '/portfolio/orant-bulls.mp4')">
        <img src="/portfolio/orant-bulls-poster.jpg" alt="Chicago Bulls" class="w-full block cursor-pointer"/>
      </div>
    </div>

    <!-- Back to portfolio -->
    <div class="border-t border-white/10 pt-12 flex justify-between items-center">
      <a href="./" class="flex items-center gap-2 text-[#60A5FA] font-[Space_Mono] text-[14px] tracking-[0.1em] hover:text-white transition-colors duration-300">
        <span class="material-symbols-outlined text-[20px]">arrow_back</span>
        BACK TO PORTFOLIO
      </a>
    </div>

  </main>

  <script>
    var activeContainer = null;
    var activeThumb = null;
    var activeSrc = null;

    function toggleVideo(container, src) {
      // If clicking the same container with active video, do nothing
      if (activeContainer === container) return;

      // Reset previous video back to thumbnail
      if (activeContainer && activeThumb) {
        var prevContainer = activeContainer;
        var prevThumb = activeThumb;
        var prevSrc = activeSrc;
        prevContainer.innerHTML = '';
        prevContainer.appendChild(prevThumb);
        prevContainer.onclick = function() { toggleVideo(prevContainer, prevSrc); };
      }

      // Save thumbnail and video src
      var thumb = container.querySelector('img');
      activeThumb = thumb.cloneNode(true);
      activeContainer = container;
      activeSrc = src;

      // Replace with video
      var video = document.createElement('video');
      video.className = 'w-full rounded-2xl';
      video.controls = true;
      video.autoplay = true;
      video.playsInline = true;
      video.muted = true;
      var source = document.createElement('source');
      source.src = src;
      source.type = 'video/mp4';
      video.appendChild(source);
      container.innerHTML = '';
      container.appendChild(video);
      container.onclick = null;
      video.play().then(function() { video.muted = false; }).catch(function(){});

      // When video ends, go back to thumbnail
      video.addEventListener('ended', function() {
        var endThumb = activeThumb;
        container.innerHTML = '';
        container.appendChild(endThumb);
        container.onclick = function() { toggleVideo(container, src); };
        activeContainer = null;
        activeThumb = null;
        activeSrc = null;
      });
    }
  </script>

<script>
  (function() {
    const html = document.documentElement;
    function updateIcon() {
      const icon = document.getElementById('theme-icon');
      if (icon) icon.textContent = html.classList.contains('light') ? 'light_mode' : 'dark_mode';
    }
    document.getElementById('theme-toggle').addEventListener('click', function() {
      if (html.classList.contains('light')) {
        html.classList.remove('light');
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      } else {
        html.classList.remove('dark');
        html.classList.add('light');
        localStorage.setItem('theme', 'light');
      }
      updateIcon();
    });
    updateIcon();
  })();
</script>
</body>
</html>
