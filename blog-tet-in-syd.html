<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Tet in Syd — Haley Pham</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;800&family=Inter:wght@400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 0.75rem; }
    ::-webkit-scrollbar-thumb:hover { background: #60A5FA; }
    html { scroll-behavior: smooth; }
    .masonry { columns: 2; column-gap: 12px; }
    @media (min-width: 640px) { .masonry { columns: 2; column-gap: 16px; } }
    @media (min-width: 1024px) { .masonry { columns: 3; column-gap: 16px; } }
    .masonry-item { break-inside: avoid; margin-bottom: 12px; }
    @media (min-width: 640px) { .masonry-item { margin-bottom: 16px; } }
    .masonry-item img { width: 100%; display: block; border-radius: 0.5rem; transition: transform 0.5s ease; }
    .masonry-item:hover img { transform: scale(1.02); }
    .lightbox { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(2,6,23,0.95); backdrop-filter: blur(8px); align-items: center; justify-content: center; padding: 20px; }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 0.5rem; }
    .lightbox-close { position: absolute; top: 20px; right: 20px; color: #dae2fd; cursor: pointer; transition: color 0.3s; }
    .lightbox-close:hover { color: #60A5FA; }
  </style>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "charcoal-surface": "#020617",
            "deep-slate": "#1E293B",
            "electric-blue": "#60A5FA",
            "refined-coral": "#FB7185",
            "on-surface": "#dae2fd",
            "on-surface-variant": "#c2c6d6",
            "muted-text": "#94A3B8",
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#020617] text-[#dae2fd] antialiased">

  <!-- Header -->
  <header class="fixed top-0 w-full z-50 bg-[#020617]/80 backdrop-blur-md border-b border-white/10 flex items-center h-16 px-[20px] md:px-[32px]">
    <a href="./" class="flex items-center gap-2 text-[#60A5FA] hover:text-white transition-colors duration-300">
      <span class="material-symbols-outlined text-[20px]">arrow_back</span>
      <span class="font-[JetBrains_Mono] text-[14px] tracking-[0.1em]">Back</span>
    </a>
  </header>

  <main class="pt-24 pb-24 px-[20px] md:px-[32px] max-w-[1440px] mx-auto">

    <!-- Hero -->
    <div class="mb-12">
      <span class="font-[JetBrains_Mono] text-[14px] tracking-[0.1em] text-[#60A5FA]">Blog</span>
      <h1 class="font-[Hanken_Grotesk] text-[48px] md:text-[72px] font-[800] leading-tight tracking-[-0.04em] mt-4 mb-6">Tet in Syd</h1>
      <p class="font-[Inter] text-[18px] leading-[28px] text-[#c2c6d6] max-w-2xl">
        Celebrating Lunar New Year in Sydney — a photo diary of traditions and new beginnings.
      </p>
    </div>

    <!-- Masonry Grid -->
    <div class="masonry">
      <div class="masonry-item"><img src="/portfolio/blog-tet-01.jpg" alt="Tet in Sydney" loading="lazy" onclick="openLightbox(this)"/></div>
      <div class="masonry-item"><img src="/portfolio/blog-tet-02.jpg" alt="Tet in Sydney" loading="lazy" onclick="openLightbox(this)"/></div>
      <div class="masonry-item"><img src="/portfolio/blog-tet-03.jpg" alt="Tet in Sydney" loading="lazy" onclick="openLightbox(this)"/></div>
      <div class="masonry-item"><img src="/portfolio/blog-tet-04.jpg" alt="Tet in Sydney" loading="lazy" onclick="openLightbox(this)"/></div>
      <div class="masonry-item"><img src="/portfolio/blog-tet-05.jpg" alt="Tet in Sydney" loading="lazy" onclick="openLightbox(this)"/></div>
      <div class="masonry-item"><img src="/portfolio/blog-tet-06.jpg" alt="Tet in Sydney" loading="lazy" onclick="openLightbox(this)"/></div>
      <div class="masonry-item"><img src="/portfolio/blog-tet-07.jpg" alt="Tet in Sydney" loading="lazy" onclick="openLightbox(this)"/></div>
      <div class="masonry-item"><img src="/portfolio/blog-tet-08.jpg" alt="Tet in Sydney" loading="lazy" onclick="openLightbox(this)"/></div>
      <div class="masonry-item"><img src="/portfolio/blog-tet-09.jpg" alt="Tet in Sydney" loading="lazy" onclick="openLightbox(this)"/></div>
      <div class="masonry-item"><img src="/portfolio/blog-tet-10.jpg" alt="Tet in Sydney" loading="lazy" onclick="openLightbox(this)"/></div>
      <div class="masonry-item"><img src="/portfolio/blog-tet-11.jpg" alt="Tet in Sydney" loading="lazy" onclick="openLightbox(this)"/></div>
      <div class="masonry-item"><img src="/portfolio/blog-tet-12.jpg" alt="Tet in Sydney" loading="lazy" onclick="openLightbox(this)"/></div>
      <div class="masonry-item"><img src="/portfolio/blog-tet-13.jpg" alt="Tet in Sydney" loading="lazy" onclick="openLightbox(this)"/></div>
      <div class="masonry-item"><img src="/portfolio/blog-tet-14.jpg" alt="Tet in Sydney" loading="lazy" onclick="openLightbox(this)"/></div>
    </div>

    <!-- Back -->
    <div class="border-t border-white/10 pt-12 mt-16 flex justify-between items-center">
      <a href="./" class="flex items-center gap-2 text-[#60A5FA] font-[JetBrains_Mono] text-[14px] tracking-[0.1em] hover:text-white transition-colors duration-300">
        <span class="material-symbols-outlined text-[20px]">arrow_back</span>
        Back to Portfolio
      </a>
      <a href="./blog-melb-night-walking.html" class="flex items-center gap-2 text-[#60A5FA] font-[JetBrains_Mono] text-[14px] tracking-[0.1em] hover:text-white transition-colors duration-300">
        Next Post
        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
      </a>
    </div>

  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <span class="lightbox-close material-symbols-outlined text-[32px]" onclick="closeLightbox(event)">close</span>
    <img id="lightbox-img" src="" alt="Full size photo"/>
  </div>

  <script>
    function openLightbox(img) { const lb = document.getElementById('lightbox'); document.getElementById('lightbox-img').src = img.src; lb.classList.add('active'); document.body.style.overflow = 'hidden'; }
    function closeLightbox(event) { if (event.target === document.getElementById('lightbox') || event.target.classList.contains('lightbox-close')) { document.getElementById('lightbox').classList.remove('active'); document.body.style.overflow = ''; } }
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { document.getElementById('lightbox').classList.remove('active'); document.body.style.overflow = ''; } });
  </script>

</body>
</html>
